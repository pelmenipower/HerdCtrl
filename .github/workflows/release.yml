name: Signed release
# Builds the Linux release files and signs them without a stored key (Sigstore keyless, through
# the workflow's GitHub OIDC identity), plus a GitHub build attestation.
# - Tag `v*` pushed by the maintainer: build, sign, attest and open a *draft* release. The
#   maintainer reviews and publishes it; this workflow never publishes on its own.
# - Pull request that touches this file: dry run (build, sign, verify), nothing is published.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [staging]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # draft release (tag runs only)
      id-token: write # Sigstore and attestation signing identity
      attestations: write
    env:
      DIST: dist
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - run: cargo build --release --locked
      - name: Package
        run: |
          python3 scripts/package-gnome-extension.py
          name="herdctrl-${GITHUB_REF_NAME//\//-}-linux-x86_64"
          mkdir -p "$DIST/$name"
          cp target/release/herdctrl README.md "$DIST/$name/"
          cp -r assets/HerdCtrl-Iconset/linux "$DIST/$name/desktop"
          tar -C "$DIST" -czf "$DIST/$name.tar.gz" "$name"
          rm -r "$DIST/$name"
          cp target/herdctrl@herdctrl.local.shell-extension.zip "$DIST/"
          (cd "$DIST" && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
          cat "$DIST/SHA256SUMS"
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums (Sigstore keyless)
        run: cosign sign-blob --yes --bundle "$DIST/SHA256SUMS.sigstore.json" "$DIST/SHA256SUMS"
      - name: Verify signature and checksums
        run: |
          cosign verify-blob \
            --bundle "$DIST/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$DIST/SHA256SUMS"
          (cd "$DIST" && sha256sum --check SHA256SUMS)
      - name: Build attestation
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: ${{ env.DIST }}/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: herdctrl-signed-release
          path: ${{ env.DIST }}/
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "HerdCtrl $GITHUB_REF_NAME" \
            --notes "Signed Linux build. Verify before use: see docs/manual.md#verify-a-download." \
            "$DIST"/*
