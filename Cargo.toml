[package]
name = "herdctrl"
version = "0.1.0"
edition = "2021"
description = "A native X11 workspace layout editor and launcher"
publish = false

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.7"
freedesktop-desktop-entry = { version = "0.8.3", default-features = false }
shlex = "2"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
