[package]
name = "herdctrl"
version = "0.1.0"
edition = "2021"
description = "A native X11 workspace layout editor and launcher"
publish = false

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
